<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CeylonX Admin</title><link rel="stylesheet" href="styles.css">
<style>main{padding:6vh 5vw}table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #eee;vertical-align:top}th{background:var(--ink);color:#fff}
.wrap{overflow-x:auto}select{font:inherit;padding:6px}.row{display:flex;gap:10px;margin:18px 0;max-width:520px}</style></head>
<body><main><h1>Bookings</h1>
<div class="row"><input id="token" type="password" placeholder="Admin token"><button class="btn" id="load">Load</button><button class="btn btn-ghost" id="test" type="button">Send test email</button></div>
<p class="error" id="err"></p>
<div class="wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Client</th><th>Package</th><th>Contact</th><th>Status</th><th>Email</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const h=()=>({'x-admin-token':$('#token').value,'Content-Type':'application/json'});
async function load(){$('#err').textContent='';const r=await fetch('/api/admin/bookings',{headers:h()});const d=await r.json();
 if(!r.ok){$('#err').textContent=d.error;return}
 $('#rows').innerHTML=d.length?d.map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.time)}</td><td><b>${esc(b.business)}</b><br>${esc(b.name)}<br><small>${esc(b.message)}</small></td><td>${esc(b.packageId)}</td><td>${esc(b.phone||'')}<br>${esc(b.email)}</td>
 <td><select data-id="${b.id}">${['pending','confirmed','cancelled'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></td><td><small>${esc(b.emailStatus||'sending')}</small></td></tr>`).join(''):'<tr><td colspan="7">No bookings yet.</td></tr>'}
$('#load').onclick=load;
$('#test').onclick=async()=>{const r=await fetch('/api/admin/test-email',{method:'POST',headers:h()});const d=await r.json();$('#err').textContent=r.ok?'Test email sent to '+d.to:d.error};
document.addEventListener('change',async e=>{if(e.target.dataset.id){await fetch('/api/admin/bookings/'+e.target.dataset.id,{method:'PATCH',headers:h(),body:JSON.stringify({status:e.target.value})})}});
</script></body></html>
